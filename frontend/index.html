<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMIS — Slaughterhouse Meat Inventory & Sales Management Information System" />
    <meta name="theme-color" content="#1a0a0c" />
    <title>SMIS — Slaughterhouse Management Information System</title>
  </head>
  <body style="margin: 0; background-color: #1a0a0c;">
    <div id="root">
      <!-- Pure-HTML Instant Splash: Displays immediately before JavaScript loads -->
      <div
        id="smis-initial-splash"
        style="
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          background-color: #1a0a0c;
          background-image: radial-gradient(ellipse 65% 65% at 50% 48%, rgba(190, 18, 60, 0.28) 0%, rgba(136, 19, 55, 0.12) 45%, #1a0a0c 80%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Work Sans', 'Inter', system-ui, -apple-system, sans-serif;
          user-select: none;
          color: #fdf2e3;
        "
      >
        <style>
          @keyframes smisSplashPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 12px 32px rgba(190, 18, 60, 0.45)) drop-shadow(0 0 20px rgba(190, 18, 60, 0.25)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 16px 44px rgba(244, 63, 94, 0.65)) drop-shadow(0 0 32px rgba(244, 63, 94, 0.45)); }
          }
          @keyframes smisSplashBar {
            0% { left: -50%; }
            50% { left: 25%; }
            100% { left: 100%; }
          }
          @media (prefers-reduced-motion: reduce) {
            #smis-splash-tile, #smis-splash-bar-fill { animation: none !important; }
            #smis-splash-bar-fill { width: 100% !important; left: 0 !important; }
          }
        </style>

        <!-- Red Unified Logo Tile with White Shield & Meat Hook (96px) -->
        <div
          id="smis-splash-tile"
          style="
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 12px 32px rgba(190, 18, 60, 0.45)) drop-shadow(0 0 20px rgba(190, 18, 60, 0.25));
            animation: smisSplashPulse 2.8s ease-in-out infinite;
            margin-bottom: 16px;
          "
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="96" height="96">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f43f5e"/>
                <stop offset="1" stop-color="#be123c"/>
              </linearGradient>
              <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
                <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg)"/>
            <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#shine)"/>
            <path d="M256 104 L384 150 V252 C384 328 330 382 256 410 C182 382 128 328 128 252 V150 Z"
                  fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
            <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="256" cy="188" r="20" stroke-width="12"/>
              <path d="M256 208 V312" stroke-width="14"/>
              <path d="M224 244 H288" stroke-width="12"/>
              <path d="M256 312 C256 352 208 352 208 312" stroke-width="14"/>
              <path d="M208 312 L196 326" stroke-width="12"/>
            </g>
          </svg>
        </div>

        <!-- Wordmark -->
        <div
          style="
            font-family: 'Alfa Slab One', 'Rockwell', 'Georgia', serif;
            font-size: 28px;
            letter-spacing: 0.05em;
            line-height: 1;
            margin-bottom: 6px;
            color: #fdf2e3;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
          "
        >
          SMIS
        </div>

        <!-- Tagline -->
        <div
          style="
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #f43f5e;
            margin-bottom: 18px;
            line-height: 1;
          "
        >
          SLAUGHTERHOUSE MIS
        </div>

        <!-- Loading Bar -->
        <div
          style="
            width: 180px;
            height: 3px;
            background: rgba(246, 235, 221, 0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
          "
        >
          <div
            id="smis-splash-bar-fill"
            style="
              position: absolute;
              top: 0;
              bottom: 0;
              width: 50%;
              border-radius: 999px;
              background: linear-gradient(90deg, #f43f5e 0%, #fbbf24 50%, #f43f5e 100%);
              animation: smisSplashBar 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            "
          ></div>
        </div>

        <!-- Status label -->
        <div
          style="
            font-size: 13px;
            font-weight: 500;
            color: #e5d5c3;
            margin-top: 14px;
            letter-spacing: 0.02em;
          "
        >
          Preparing your workspace...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
