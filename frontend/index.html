<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMIS — Slaughterhouse Meat Inventory & Sales Management Information System" />
    <meta name="theme-color" content="#1a0a0c" />
    <title>SMIS — Slaughterhouse Management Information System</title>
  </head>
  <body style="margin: 0; background-color: #1a0a0c;">
    <div id="root">
      <!-- Pure-HTML Instant Splash: Displays immediately before JavaScript loads -->
      <div
        id="smis-initial-splash"
        style="
          position: fixed;
          inset: 0;
          width: 100vw;
          height: 100vh;
          background-color: #1a0a0c;
          background-image: radial-gradient(ellipse 65% 65% at 50% 48%, rgba(190, 18, 60, 0.28) 0%, rgba(136, 19, 55, 0.12) 45%, #1a0a0c 80%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Work Sans', 'Inter', system-ui, -apple-system, sans-serif;
          user-select: none;
          color: #fdf2e3;
        "
      >
        <style>
          @keyframes smisSplashPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 36px rgba(190, 18, 60, 0.45), 0 0 20px rgba(190, 18, 60, 0.25); }
            50% { transform: scale(1.05); box-shadow: 0 16px 44px rgba(244, 63, 94, 0.6), 0 0 32px rgba(244, 63, 94, 0.4); }
          }
          @keyframes smisSplashBar {
            0% { left: -50%; }
            50% { left: 25%; }
            100% { left: 100%; }
          }
          @keyframes smisSplashHook {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
          }
          @media (prefers-reduced-motion: reduce) {
            #smis-splash-tile, #smis-splash-hook, #smis-splash-bar-fill { animation: none !important; }
            #smis-splash-bar-fill { width: 100% !important; left: 0 !important; }
          }
        </style>

        <!-- Red Logo Tile with White Shield & Meat Hook -->
        <div
          id="smis-splash-tile"
          style="
            width: 76px;
            height: 76px;
            border-radius: 18px;
            background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 36px rgba(190, 18, 60, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            animation: smisSplashPulse 2.8s ease-in-out infinite;
            margin-bottom: 16px;
          "
        >
          <svg width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M24 5L39 10.5V22C39 31.8 32.5 40 24 43.5C15.5 40 9 31.8 9 22V10.5L24 5Z"
              fill="rgba(255, 255, 255, 0.16)"
              stroke="#FFFFFF"
              stroke-width="2.8"
              stroke-linejoin="round"
            />
            <path
              d="M24 9.5L34 13.5V21.5C34 27.5 29.5 34 24 36.8C18.5 34 14 27.5 14 21.5V13.5L24 9.5Z"
              fill="rgba(0, 0, 0, 0.22)"
            />
            <g id="smis-splash-hook" style="transform-origin: 24px 14px; animation: smisSplashHook 2.6s ease-in-out infinite;">
              <circle cx="24" cy="14" r="2.2" stroke="#FFFFFF" stroke-width="1.8" fill="none" />
              <path
                d="M24 16.2V26.5C24 26.5 24 33.5 19 33.5C15.5 33.5 14 31 14 28.5C14 25.5 16.5 24.5 18 26"
                stroke="#FFFFFF"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                fill="none"
              />
              <path d="M15 17.5H33" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
              <path d="M14 20L17 25H13L14 20Z" fill="#FFFFFF" fill-opacity="0.9" />
              <circle cx="15" cy="27.5" r="1.3" fill="#FFFFFF" />
              <path d="M34 20L35 25H31L34 20Z" fill="#FFFFFF" fill-opacity="0.9" />
              <circle cx="33" cy="27.5" r="1.3" fill="#FFFFFF" />
              <polygon points="24,10 26.5,13.5 21.5,13.5" fill="#FFFFFF" />
            </g>
          </svg>
        </div>

        <!-- Wordmark -->
        <div
          style="
            font-family: 'Alfa Slab One', 'Rockwell', 'Georgia', serif;
            font-size: 28px;
            letter-spacing: 0.05em;
            line-height: 1;
            margin-bottom: 6px;
            color: #fdf2e3;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
          "
        >
          SMIS
        </div>

        <!-- Tagline -->
        <div
          style="
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #f43f5e;
            margin-bottom: 18px;
            line-height: 1;
          "
        >
          SLAUGHTERHOUSE MIS
        </div>

        <!-- Loading Bar -->
        <div
          style="
            width: 180px;
            height: 3px;
            background: rgba(246, 235, 221, 0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin: 0 auto;
          "
        >
          <div
            id="smis-splash-bar-fill"
            style="
              position: absolute;
              top: 0;
              bottom: 0;
              width: 50%;
              border-radius: 999px;
              background: linear-gradient(90deg, #f43f5e 0%, #fbbf24 50%, #f43f5e 100%);
              animation: smisSplashBar 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            "
          ></div>
        </div>

        <!-- Status label -->
        <div
          style="
            font-size: 13px;
            font-weight: 500;
            color: #e5d5c3;
            margin-top: 14px;
            letter-spacing: 0.02em;
          "
        >
          Preparing your workspace...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
